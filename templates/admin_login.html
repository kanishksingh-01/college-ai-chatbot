<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | GH Raisoni College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-badge admin-badge">⚙️</div>
        <h2>Administrator Portal</h2>
        <p class="auth-sub">GH Raisoni College AI Knowledge Base & Control Center</p>
    </div>

    {% if error %}
        <div class="error-alert">
            <span class="error-icon">⚠️</span>
            <span>{{ error }}</span>
        </div>
    {% endif %}

    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="username">Admin Username</label>
            <div class="input-with-icon">
                <span class="field-icon">👤</span>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter admin username" 
                    required 
                    autocomplete="username" 
                    autofocus
                >
            </div>
        </div>

        <div class="form-group">
            <label for="password">Security Password</label>
            <div class="input-with-icon">
                <span class="field-icon">🔒</span>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter password" 
                    required 
                    autocomplete="current-password"
                >
            </div>
        </div>

        <button type="submit" class="submit-btn admin-submit-btn">Authenticate & Access Dashboard →</button>
    </form>

    <div class="demo-logins admin-demo-hint">
        <span>Default Demo Credentials: <code>admin</code> / <code>admin123</code></span>
    </div>

    <div class="auth-footer">
        <a href="/" class="back-link">&larr; Return to Chatbot</a>
    </div>
</div>

<script>
// Apply saved theme
const savedTheme = localStorage.getItem('ghr_theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
</script>

</body>
</html>
