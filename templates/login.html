<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Student Login</h2>
    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label>Roll Number</label>
        <input type="text" name="roll_no" placeholder="e.g. ISTU25010120099">
        <button type="submit">Login</button>
    </form>
    <p>Try sample roll number: ISTU25010120099</p>
    <a href="/">← Back to chatbot</a>
</body>
</html>
