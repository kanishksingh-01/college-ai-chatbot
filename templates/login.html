<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="form-container">
    <h2>Student Login</h2>
    {% if error %}
        <p class="error-msg">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label for="roll_no">Roll Number</label>
        <input type="text" id="roll_no" name="roll_no" placeholder="e.g. ISTU25010120001" required>
        <button type="submit">Login</button>
    </form>
    <p class="hint">Try sample roll number: ISTU25010120001</p>
    <a href="/" class="link-btn">&larr; Back to chatbot</a>
</div>

</body>
</html>
