<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System &amp; UML Diagrams - AI Chatbot for College</title>
<style>
    @page {
        size: A4 portrait;
        margin: 0;
    }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
        background-color: #525659;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px 0;
    }
    .page {
        width: 210mm;
        height: 297mm;
        max-height: 297mm;
        padding: 10mm 12mm;
        background: white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.35);
        display: flex;
        flex-direction: column;
        page-break-after: always;
        page-break-inside: avoid;
        overflow: hidden;
    }
    /* College Project Double Blue Border */
    .outer-border {
        border: 2.5px solid #1e3d73;
        padding: 3px;
        height: 100%;
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    .inner-border {
        border: 1px solid #1e3d73;
        padding: 14px 16px 8px 16px;
        height: 100%;
        display: flex;
        flex-direction: column;
        flex: 1;
        position: relative;
    }
    .doc-header {
        text-align: center;
        margin-bottom: 6px;
    }
    .doc-title {
        font-size: 22px;
        font-weight: 800;
        color: #0f254e;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    .doc-subtitle {
        font-size: 11.5px;
        color: #64748b;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .diagram-heading {
        font-size: 14.5px;
        font-weight: 700;
        color: #1e3d73;
        margin: 4px 0 6px 0;
        border-left: 4px solid #1e3d73;
        padding-left: 8px;
    }
    .diagram-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .diagram-container svg {
        max-height: 205mm;
        width: auto;
    }
    .figure-caption {
        text-align: center;
        font-size: 11px;
        font-style: italic;
        color: #475569;
        margin-top: 4px;
    }

    @media print {
        body {
            background: none;
            padding: 0;
            gap: 0;
        }
        .page {
            box-shadow: none;
            margin: 0;
            width: 210mm;
            height: 297mm;
            max-height: 297mm;
            page-break-after: always;
            page-break-inside: avoid;
        }
    }
</style>
</head>
<body>
<!-- ================= PAGE 7: ENTITY RELATIONSHIP DIAGRAM (ERD) ================= -->
<div class="page">
    <div class="outer-border">
        <div class="inner-border">

                <div class="doc-subtitle">AI Chatbot for College &middot; BBA Computer Applications</div>

    <line x1="650" y1="198" x2="710" y2="260" stroke="#0f254e" stroke-width="2"/>

        <line x1="110" y1="6" x2="105" y2="-45" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- LEGEND / EXPLANATION FOOTER -->
    <rect x="25" y="520" width="710" height="155" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="40" y="545" font-size="12.5" font-weight="bold" fill="#0f254e">&#10004; Standard Entity-Relationship Diagram Flow Summary:</text>
    <text x="55" y="570" font-size="11" fill="#334155">&bull; &lt;b&gt;Left-to-Right Primary Data Flow:&lt;/b&gt; STUDENT [1] submits [N] CHAT_HISTORY, which answers [N:1] from COLLEGE_INFO.</text>
    <text x="55" y="592" font-size="11" fill="#334155">&bull; &lt;b&gt;Top-to-Bottom Admin Control Flow:&lt;/b&gt; ADMIN_USER [1] audits [M] CHAT_HISTORY and manages [M] COLLEGE_INFO FAQs.</text>

</svg>
            </div>

            <div class="figure-caption">Fig: Entity-Relationship Diagram (ERD) &mdash; structured left-to-right relational flow with non-crossing attribute branches, primary keys, and cardinalities.</div>
        </div>
    </div>
</div>
