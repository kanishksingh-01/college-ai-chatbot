<!DOCTYPE html>
<html lang="en">
<head>

<title>System &amp; UML Diagrams - AI Chatbot for College</title>
<style>
    @page {
        size: A4 portrait;
        margin: 0;
    }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
        background-color: #525659;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px 0;
    }
    .page {
        width: 210mm;
        height: 297mm;
        max-height: 297mm;
        padding: 10mm 12mm;
        background: white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.35);
        display: flex;
        flex-direction: column;
        page-break-after: always;
        page-break-inside: avoid;
        overflow: hidden;
    }
    /* College Project Double Blue Border */
    .outer-border {
        border: 2.5px solid #1e3d73;
        padding: 3px;
        height: 100%;
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    .inner-border {
        border: 1px solid #1e3d73;
        padding: 14px 16px 8px 16px;
        height: 100%;
        display: flex;
        flex-direction: column;
        flex: 1;
        position: relative;
    }
    .doc-header {
        text-align: center;
        margin-bottom: 6px;
    }
    .doc-title {
        font-size: 22px;
        font-weight: 800;
        color: #0f254e;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    .doc-subtitle {
        font-size: 11.5px;
        color: #64748b;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .diagram-heading {
        font-size: 14.5px;
        font-weight: 700;
        color: #1e3d73;
        margin: 4px 0 6px 0;
        border-left: 4px solid #1e3d73;
        padding-left: 8px;
    }
    .diagram-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .diagram-container svg {
        max-height: 205mm;
        width: auto;
    }
    .figure-caption {
        text-align: center;
        font-size: 11px;
        font-style: italic;
        color: #475569;
        margin-top: 4px;
    }

    @media print {
        body {
            background: none;
            padding: 0;
            gap: 0;
        }
        .page {
            box-shadow: none;
            margin: 0;
            width: 210mm;
            height: 297mm;
            max-height: 297mm;
            page-break-after: always;
            page-break-inside: avoid;
        }
    }
</style>
</head>
